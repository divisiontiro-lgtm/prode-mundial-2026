<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Posiciones</title>
<style>
  body {
    background: linear-gradient(160deg, #0d0d1a 0%, #1a1a2e 40%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
  }
  .navbar-brand { font-weight: 800; }
  .bg-deco {
    position: fixed; font-size: 22rem; opacity: 0.025;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 0; user-select: none;
  }
  .content { position: relative; z-index: 1; }

  /* ── CAMPEÓN ── */
  #campeon-banner {
    display: none; text-align: center;
    padding: 2rem 1rem 1rem;
    animation: fadeInDown 0.6s ease;
  }
  .campeon-copa { font-size: 5rem; display: block; animation: float 2s ease-in-out infinite; }
  .campeon-titulo {
    font-size: 1.6rem; font-weight: 900; color: #e8a838;
    text-shadow: 0 0 20px rgba(232,168,56,0.6); letter-spacing: 1px;
  }
  .campeon-nombre { font-size: 1.1rem; color: rgba(255,255,255,0.8); margin-top: 4px; }
  .stars { font-size: 1.4rem; letter-spacing: 4px; animation: sparkle 1.5s ease-in-out infinite alternate; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes sparkle { from{opacity:.6;text-shadow:none} to{opacity:1;text-shadow:0 0 12px #e8a838} }
  @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }

  /* ── TABLA ── */
  .tabla-wrapper { max-width: 560px; margin: 0 auto; padding: 0 1rem 2rem; }
  .tabla-titulo {
    font-size: 1rem; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    text-align: center; margin-bottom: 1rem;
  }
  .row-posicion {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 14px;
    margin-bottom: 8px; gap: 12px;
    transition: background 0.2s;
    animation: slideIn 0.3s ease both;
  }
  .row-posicion:hover { background: rgba(255,255,255,0.09); }
  .row-posicion.yo { background: rgba(232,168,56,0.12); border-color: rgba(232,168,56,0.35); }
  @keyframes slideIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
  .pos-num { font-size:1rem; font-weight:800; width:32px; text-align:center; flex-shrink:0; color:rgba(255,255,255,0.4); }
  .pos-num.gold   { color:#FFD700; font-size:1.1rem; }
  .pos-num.silver { color:#C0C0C0; font-size:1.05rem; }
  .pos-num.bronze { color:#CD7F32; }
  .pos-medal { font-size:1.2rem; width:28px; text-align:center; flex-shrink:0; }
  .pos-nombre { flex:1; font-weight:600; font-size:.9rem; }
  .yo-tag {
    font-size:.65rem; background:#e8a838; color:#000;
    padding:1px 6px; border-radius:10px; font-weight:700;
    margin-left:6px; vertical-align:middle;
  }
  .pos-puntos { font-size:1rem; font-weight:800; color:#e8a838; flex-shrink:0; min-width:40px; text-align:right; }
  .pos-puntos small { font-size:.6rem; color:rgba(255,255,255,0.4); font-weight:400; display:block; text-align:right; margin-top:-2px; }
  .refresh-bar { text-align:center; font-size:.7rem; color:rgba(255,255,255,0.3); padding-bottom:.5rem; }

  #lider-banner { display:none; text-align:center; padding:1.5rem 1rem 0.5rem; }
</style>
</head>
<body>
<div class="bg-deco">⚽</div>
<div class="content">

<nav class="navbar navbar-expand-lg navbar-dark" style="background:rgba(0,0,0,0.4);backdrop-filter:blur(8px)">
  <div class="container-fluid">
    <span class="navbar-brand">🏆 PRODE MUNDIAL</span>
    <div class="navbar-nav flex-row" id="menu"></div>
    <div class="ms-auto text-white d-flex align-items-center gap-2">
      <small id="usuarioNavbar"></small>
      <button class="btn btn-outline-light btn-sm" onclick="salir()">Salir</button>
    </div>
  </div>
</nav>

<div id="campeon-banner">
  <span class="campeon-copa">🏆</span>
  <div class="stars">★ ★ ★ ★ ★</div>
  <div class="campeon-titulo">¡SOS EL CAMPEÓN DEL MUNDO!</div>
  <div class="campeon-nombre" id="campeon-nombre"></div>
</div>

<div id="lider-banner">
  <div style="font-size:.8rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px">Líder del torneo</div>
  <div id="lider-nombre" style="font-size:1.3rem;font-weight:800;color:#e8a838;margin-top:4px"></div>
</div>

<div class="tabla-wrapper mt-3">
  <div class="tabla-titulo">Tabla de Posiciones</div>
  <div id="tabla">
    <div class="text-center py-4" style="color:rgba(255,255,255,0.4)">
      <div class="spinner-border spinner-border-sm me-2"></div>Cargando...
    </div>
  </div>
  <div class="refresh-bar" id="refresh-bar"></div>
</div>

</div>
<script>
const API     = "https://script.google.com/macros/s/AKfycbwHYzEcdorq6L_UjrXLDLFbkNWeDrtgxiFKDT7EfQ6fFsU-12heggLqoeSnvvIYwJUY/exec";
const usuario = localStorage.getItem("usuario");
const rol     = localStorage.getItem("rol");

if (!usuario) { alert("Debe iniciar sesión"); window.location = "index.html"; }
document.getElementById("usuarioNavbar").textContent = usuario;

let menuHtml = `
  <a class="nav-link me-3" href="apuestas.html">Apuestas</a>
  <a class="nav-link me-3" href="posiciones.html">Posiciones</a>
  <a class="nav-link me-3" href="bracket.html">Bracket</a>
`;
if (rol == "admin") menuHtml += `<a class="nav-link" href="admin.html">Admin</a>`;
document.getElementById("menu").innerHTML = menuHtml;

function salir() { localStorage.clear(); window.location = "index.html"; }

const medals   = ["🥇","🥈","🥉"];
const numClass = ["gold","silver","bronze"];

const TOTAL_PARTIDOS_GRUPOS = 72; // 12 grupos × 6 partidos

async function cargarTodo() {
  try {
    const [resPosiciones, resPartidos] = await Promise.all([
      fetch(`${API}?accion=posiciones`),
      fetch(`${API}?accion=partidos`)
    ]);
    const posiciones = await resPosiciones.json();
    const partidos   = await resPartidos.json();

    // Torneo finalizado cuando todos los partidos de grupos están terminados
    const finalizados      = partidos.filter(p => p.estado === "finalizado").length;
    const torneoFinalizado = finalizados >= TOTAL_PARTIDOS_GRUPOS;

    renderTabla(posiciones, torneoFinalizado);
    actualizarHora();
  } catch(e) {
    document.getElementById("tabla").innerHTML =
      `<div class="text-center py-3" style="color:rgba(255,255,255,0.4)">Error al cargar</div>`;
  }
}

function renderTabla(posiciones, torneoFinalizado) {
  if (!posiciones.length) {
    document.getElementById("tabla").innerHTML =
      `<div class="text-center py-4" style="color:rgba(255,255,255,0.3)">Aún no hay puntos cargados</div>`;
    return;
  }

  const lider = posiciones[0].usuario;

  // Banners: solo mostrar campeón si el torneo finalizó
  if (torneoFinalizado) {
    if (lider === usuario) {
      document.getElementById("campeon-banner").style.display = "block";
      document.getElementById("campeon-nombre").textContent   = usuario;
      document.getElementById("lider-banner").style.display   = "none";
    } else {
      document.getElementById("campeon-banner").style.display = "none";
      document.getElementById("lider-banner").style.display   = "block";
      document.getElementById("lider-nombre").textContent     = "🏆 " + lider + " — CAMPEÓN DEL MUNDO";
    }
  } else {
    // Torneo en curso: mostrar líder sin animación de campeón
    document.getElementById("campeon-banner").style.display = "none";
    if (lider !== usuario) {
      document.getElementById("lider-banner").style.display = "block";
      document.getElementById("lider-nombre").textContent   = lider;
    }
  }

  let html = "";
  posiciones.forEach((p, i) => {
    const esYo   = p.usuario === usuario;
    const medal  = i < 3 ? `<span class="pos-medal">${medals[i]}</span>` : `<span class="pos-medal"></span>`;
    const numCls = i < 3 ? numClass[i] : "";
    html += `
    <div class="row-posicion${esYo?" yo":""}" style="animation-delay:${i*0.05}s">
      <div class="pos-num ${numCls}">${i+1}</div>
      ${medal}
      <div class="pos-nombre">${p.usuario}${esYo?`<span class="yo-tag">vos</span>`:""}</div>
      <div class="pos-puntos">${p.puntos}<small>pts</small></div>
    </div>`;
  });
  document.getElementById("tabla").innerHTML = html;
}

function actualizarHora() {
  const ahora = new Date();
  document.getElementById("refresh-bar").textContent =
    `Actualizado ${ahora.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})} · se actualiza cada 30s`;
}

cargarTodo();
setInterval(cargarTodo, 30000);
</script>
</body>
</html>
