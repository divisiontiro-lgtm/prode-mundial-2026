<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Apuestas</title>
<style>
  body {
    background: linear-gradient(160deg, #0d0d1a 0%, #1a1a2e 40%, #0f3460 100%);
    min-height: 100vh;
  }
  .bg-deco {
    position: fixed; font-size: 22rem; opacity: 0.025;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 0; user-select: none;
  }
  .grupo-card {
    background: rgba(255,255,255,0.07);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .grupo-header {
    background: rgba(255,255,255,0.05);
    color: #fff;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }
  .partido-row {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 8px;
    flex-wrap: wrap;
  }
  .partido-row:last-child { border-bottom: none; }
  .partido-row.bloqueado { opacity: 0.65; }
  .equipos {
    flex: 1;
    min-width: 0;
    font-size: 0.82rem;
    font-weight: 500;
    color: #fff;
  }
  .equipos .meta {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
  }
  .btns-apuesta { display: flex; gap: 4px; flex-shrink: 0; }
  .btn-ap {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    border: 2px solid;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    background: transparent;
  }
  .btn-ap.L-off  { border-color: #198754; color: #198754; }
  .btn-ap.L-on   { border-color: #198754; background: #198754; color: #fff; }
  .btn-ap.E-off  { border-color: #ffc107; color: #b38600; }
  .btn-ap.E-on   { border-color: #ffc107; background: #ffc107; color: #000; }
  .btn-ap.V-off  { border-color: #dc3545; color: #dc3545; }
  .btn-ap.V-on   { border-color: #dc3545; background: #dc3545; color: #fff; }
  .btn-ap:disabled { cursor: default; opacity: 0.5; }
  .estado-badge {
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .estado-proximo    { background: #e8f5e9; color: #2e7d32; }
  .estado-en_juego   { background: #fff8e1; color: #f57f17; }
  .estado-finalizado { background: #fce4ec; color: #c62828; }
  .navbar-brand { font-weight: 800; }
  .saving-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #e8a838;
    margin-left: 6px;
    animation: pulse 0.8s infinite;
    vertical-align: middle;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
</style>
</head>
<body>

<div class="bg-deco">⚽</div>
<nav class="navbar navbar-expand-lg navbar-dark py-2" style="background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);position:relative;z-index:1">
  <div class="container-fluid">
    <span class="navbar-brand">🏆 PRODE MUNDIAL</span>
    <div class="navbar-nav flex-row" id="menu"></div>
    <div class="ms-auto text-white d-flex align-items-center gap-2">
      <small id="usuarioNavbar"></small>
      <button class="btn btn-outline-light btn-sm" onclick="salir()">Salir</button>
    </div>
  </div>
</nav>

<div class="container mt-3" style="max-width:700px;position:relative;z-index:1">
  <div id="cargando" class="text-center py-5" style="color:rgba(255,255,255,0.4)">
    <div class="spinner-border spinner-border-sm me-2"></div>Cargando partidos...
  </div>
  <div id="partidos"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwHYzEcdorq6L_UjrXLDLFbkNWeDrtgxiFKDT7EfQ6fFsU-12heggLqoeSnvvIYwJUY/exec";
const usuario = localStorage.getItem("usuario");
const rol     = localStorage.getItem("rol");

if (!usuario) { alert("Debe iniciar sesión"); window.location = "index.html"; }

document.getElementById("usuarioNavbar").textContent = usuario;

let menuHtml = `
  <a class="nav-link me-3" href="apuestas.html">Apuestas</a>
  <a class="nav-link me-3" href="posiciones.html">Posiciones</a>
  <a class="nav-link me-3" href="bracket.html">Bracket</a>
`;
if (rol == "admin") menuHtml += `<a class="nav-link" href="admin.html">Admin</a>`;
document.getElementById("menu").innerHTML = menuHtml;

let misPronosticos = {};

// ── CARGA INICIAL ──────────────────────────────────────
async function cargarTodo() {
  try {
    const [resPron, resPartidos] = await Promise.all([
      fetch(`${API}?accion=misPronosticos&usuario=${encodeURIComponent(usuario)}`),
      fetch(`${API}?accion=partidos`)
    ]);
    misPronosticos = await resPron.json();
    const partidos = await resPartidos.json();
    renderPartidos(partidos);
  } catch(e) {
    document.getElementById("cargando").innerHTML = "Error al cargar. <a href='#' onclick='cargarTodo()'>Reintentar</a>";
  }
}

function renderPartidos(partidos) {
  document.getElementById("cargando").style.display = "none";
  const grupos = {};
  partidos.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });

  let html = "";
  Object.keys(grupos).sort().forEach(g => {
    html += `<div class="grupo-card">`;
    html += `<div class="grupo-header">GRUPO ${g}</div>`;
    grupos[g].forEach(p => {
      const apuesta   = misPronosticos[p.id] || "";
      const bloqueado = p.estado !== "proximo";
      const estadoLabel = p.estado === "proximo" ? "🟢 Próximo" : p.estado === "en_juego" ? "🟡 En juego" : "🔴 Finalizado";
      const estadoClass = p.estado;
      const fecha = typeof p.fecha === "string" ? p.fecha.substring(0,10) : "";

      html += `
      <div class="partido-row${bloqueado ? " bloqueado" : ""}">
        <div class="equipos">
          <div>${p.localFlag} ${p.local} <span style="color:#999;font-size:.7rem">L</span> · ${p.visitanteFlag} ${p.visitante}</div>
          <div class="meta">📅 ${fecha} ${p.hora}</div>
        </div>
        <span class="estado-badge estado-${estadoClass}">${estadoLabel}</span>
        <div class="btns-apuesta">
          <button id="btn-${p.id}-L" class="btn-ap ${apuesta==='L'?'L-on':'L-off'}"
            ${bloqueado?"disabled":""} onclick="apostar(${p.id},'L')">L</button>
          <button id="btn-${p.id}-E" class="btn-ap ${apuesta==='E'?'E-on':'E-off'}"
            ${bloqueado?"disabled":""} onclick="apostar(${p.id},'E')">E</button>
          <button id="btn-${p.id}-V" class="btn-ap ${apuesta==='V'?'V-on':'V-off'}"
            ${bloqueado?"disabled":""} onclick="apostar(${p.id},'V')">V</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById("partidos").innerHTML = html;
}

// ── APOSTAR — UI OPTIMISTA (sin reload) ───────────────
function apostar(partidoId, pronostico) {
  // Actualizar UI inmediatamente
  ['L','E','V'].forEach(t => {
    const btn = document.getElementById(`btn-${partidoId}-${t}`);
    if (!btn) return;
    const on = t === pronostico;
    btn.className = `btn-ap ${on ? t+'-on' : t+'-off'}`;
  });
  misPronosticos[partidoId] = pronostico;

  // Guardar en segundo plano
  fetch(`${API}?accion=apostar&usuario=${encodeURIComponent(usuario)}&partido=${partidoId}&pronostico=${pronostico}`)
    .catch(() => console.warn("Error al guardar apuesta partido", partidoId));
}

function salir() {
  localStorage.clear();
  window.location = "index.html";
}

cargarTodo();
</script>
</body>
</html>
