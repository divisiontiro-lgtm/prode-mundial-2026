<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Prode Mundial 2026</title>
<style>
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 2rem;
    color: #fff;
  }
  .login-card h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; }
  .login-card .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .form-control {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 8px;
  }
  .form-control:focus {
    background: rgba(255,255,255,0.12);
    border-color: #e8a838;
    color: #fff;
    box-shadow: 0 0 0 2px rgba(232,168,56,0.25);
  }
  .form-control::placeholder { color: rgba(255,255,255,0.35); }
  .form-label { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
  .btn-login {
    background: #e8a838;
    border: none;
    color: #000;
    font-weight: 700;
    border-radius: 8px;
    padding: 0.5rem;
    width: 100%;
    margin-top: 0.5rem;
    transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.88; }
  .trophy { font-size: 2.5rem; display: block; text-align: center; margin-bottom: 0.5rem; }
</style>
</head>
<body>

<div class="login-card">
  <span class="trophy">🏆</span>
  <h1>PRODE MUNDIAL</h1>
  <p class="subtitle">Copa del Mundo 2026</p>

  <label class="form-label">Usuario</label>
  <input id="usuario" class="form-control mb-3" placeholder="Tu usuario" autocomplete="username">

  <label class="form-label">Contraseña</label>
  <input type="password" id="password" class="form-control mb-3" placeholder="••••••••" autocomplete="current-password">

  <button class="btn-login" onclick="login()" id="btnLogin">Ingresar</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwHYzEcdorq6L_UjrXLDLFbkNWeDrtgxiFKDT7EfQ6fFsU-12heggLqoeSnvvIYwJUY/exec";

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

async function login() {
  let usuario  = document.getElementById("usuario").value.trim();
  let password = document.getElementById("password").value;
  let btn      = document.getElementById("btnLogin");

  if (!usuario || !password) { alert("Completá usuario y contraseña"); return; }

  btn.textContent = "Ingresando...";
  btn.disabled    = true;

  try {
    let res   = await fetch(`${API}?accion=login&usuario=${encodeURIComponent(usuario)}&password=${encodeURIComponent(password)}`);
    let datos = await res.json();

    if (datos.ok) {
      localStorage.setItem("usuario", usuario);
      localStorage.setItem("rol",     datos.rol);
      window.location = datos.rol == "admin" ? "admin.html" : "apuestas.html";
    } else {
      alert("Usuario o contraseña incorrectos");
      btn.textContent = "Ingresar";
      btn.disabled    = false;
    }
  } catch(err) {
    alert("Error de conexión");
    btn.textContent = "Ingresar";
    btn.disabled    = false;
  }
}
</script>

</body>
</html>
